# TinyEarth root configuration.
#
# Composition order matters. The registered structured schema comes first so
# that every group loaded afterwards is validated against it; `_self_` comes
# last so that values written in *this* file win over the groups.
#
# Phase 3 status: every group now has a default, so `tinyearth-train` runs out
# of the box without the ~100 GB EarthNet2021 download. Select the real data
# with `data=earthnet2021`, and swap the component under study with
# `model=transformer`. Phase 4 adds the State Space Model configs.

defaults:
  - tinyearth_schema
  - data: synthetic
  - model: convlstm
  - training: default
  - _self_
  # `none`, not `disabled`. Both stop Hydra configuring handlers, but Hydra's
  # `disabled` profile sets `disable_existing_loggers: true`, which silently
  # switches off every logger that already exists -- meaning every module-level
  # `get_logger(__name__)` created at import time. Library warnings then vanish
  # from both console and file with no error. `none` sets it to false.
  # `setup_logging` re-enables the hierarchy defensively as well.
  - override hydra/job_logging: none
  - override hydra/hydra_logging: none

run:
  name: default
  group: dev
  notes: ""
  tags: []
  device: auto

seed:
  value: 42
  deterministic: true
  cudnn_benchmark: false

paths:
  data: data
  outputs: outputs
  cache: .cache

logging:
  level: INFO
  rich: true
  log_file: run.log
  tensorboard:
    enabled: true
    flush_secs: 30
  wandb:
    enabled: false
    project: tinyearth
    entity: null
    mode: online

hydra:
  # TinyEarth manages its own run directory via `paths` + `run.group`/`run.name`
  # so that outputs are addressable by experiment identity rather than by
  # wall-clock time. Hydra's own directory is kept only for its job metadata.
  run:
    dir: ${paths.outputs}/.hydra/${run.group}/${run.name}
  sweep:
    dir: ${paths.outputs}/.hydra/multirun/${run.group}
    subdir: ${hydra.job.num}
  job:
    chdir: false
